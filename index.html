
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10162f">
<title>سراج | ألعاب التدريس الممتعة</title>
<style>
:root{--bg:#0b1024;--panel:#151d39;--gold:#ffd477;--text:#f7f8ff;--muted:#aeb9d6;--line:#303b61;--green:#49dfa1;--red:#ff7285}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#202b54,var(--bg) 65%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:bold;transition:.2s}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}
.primary{background:linear-gradient(135deg,#ffe5a0,#f3b94e);color:#20203a}
.secondary{background:#253153;color:white;border:1px solid #43517b}
.danger{background:#582b43;color:#ffdce3}
header{padding:24px 16px 16px;text-align:center;border-bottom:1px solid #ffffff16}
.logo{width:64px;height:64px;display:grid;place-items:center;margin:auto;border-radius:20px;background:linear-gradient(135deg,#ffe6a4,#d99b32);color:#171d35;font-size:32px;box-shadow:0 8px 30px #ffc85c22}
h1{font-size:clamp(24px,5vw,38px);margin:12px 0 8px}
.gold{color:var(--gold)}
header p{color:var(--muted);margin:0}
main{max-width:1100px;margin:auto;padding:18px}
.section-title{font-size:21px;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat,.panel,.game-card{background:#151d39eF;border:1px solid var(--line);border-radius:18px;padding:16px}
.stat{text-align:center}.stat strong{display:block;font-size:25px;color:var(--gold)}.stat span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.game-card{text-align:right;color:white;cursor:pointer;min-height:135px;display:flex;flex-direction:column;gap:8px}
.game-card.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.game-icon{font-size:30px}.game-card b{font-size:15px}.game-card small{color:var(--muted);line-height:1.7}
.panel{margin-top:18px}
label{display:block;color:#e4e8fa;font-weight:bold;margin:12px 0 7px}
input,textarea,select{width:100%;background:#0d1430;color:white;border:1px solid #3a466c;border-radius:11px;padding:12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{min-height:125px;resize:vertical;line-height:1.8}
.hint{font-size:12px;color:var(--muted);line-height:1.8}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
#playArea{display:none;text-align:center;padding:20px 0}
.play-box{max-width:800px;margin:auto;background:#151d39;border:1px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,36px);min-height:260px}
.progress{height:7px;background:#303b61;border-radius:9px;overflow:hidden;margin:18px 0}
.progress div{height:100%;background:var(--gold);width:0;transition:width .3s}
#question{font-size:clamp(21px,4vw,32px);line-height:1.7;margin:20px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.answer{background:#222e51;color:white;border:1px solid #455580;min-height:55px}
.answer.correct{background:#155e4a;border-color:var(--green)}
.answer.wrong{background:#692c43;border-color:var(--red)}
#feedback{min-height:28px;margin:15px 0;color:var(--gold)}
.big-wheel{width:min(280px,70vw);height:min(280px,70vw);margin:20px auto;border-radius:50%;border:8px solid var(--gold);background:conic-gradient(#e7b751 0 45deg,#263e6b 45deg 90deg,#bb6e83 90deg 135deg,#294f62 135deg 180deg,#b77d3c 180deg 225deg,#403d7b 225deg 270deg,#3b826f 270deg 315deg,#a94c60 315deg);display:grid;place-items:center;box-shadow:0 0 40px #0007}
.big-wheel span{font-size:23px;font-weight:bold;background:#10162fdd;padding:15px;border-radius:50%;max-width:65%;overflow-wrap:anywhere}
.scoreboard{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.team{padding:12px 18px;background:#202c4c;border-radius:12px}
.team strong{color:var(--gold);font-size:22px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:28px 12px}
.hidden{display:none!important}
@media(max-width:520px){main{padding:12px}.row{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:12px 5px}.stat strong{font-size:21px}.actions button{flex:1}}
</style>
</head>
<body>
<header>
  <div class="logo">✦</div>
  <h1>سراج <span class="gold">| ألعاب التدريس الممتعة</span></h1>
  <p>حوّل كل درس إلى مغامرة تعليمية مليئة بالحماس! 🚀</p>
</header>

<main>
  <div class="stats">
    <div class="stat"><strong id="totalGames">0</strong><span>ألعاب محفوظة</span></div>
    <div class="stat"><strong id="totalPoints">0</strong><span>النقاط المسجلة</span></div>
    <div class="stat"><strong>15</strong><span>نوعًا من الألعاب</span></div>
  </div>

  <h2 class="section-title">🎮 اختر اللعبة</h2>
  <div class="grid" id="gameGrid"></div>

  <section class="panel" id="builder">
    <h2 class="section-title">🛠️ جهّز لعبتك</h2>
    <div class="row">
      <div>
        <label for="lesson">اسم الدرس أو المادة</label>
        <input id="lesson" placeholder="مثال: درس الجملة الاسمية">
      </div>
      <div>
        <label for="gameTitle">اسم اللعبة</label>
        <input id="gameTitle" placeholder="تحدي الأبطال">
      </div>
    </div>
    <label for="entries">المحتوى التعليمي</label>
    <textarea id="entries" placeholder="كل سؤال في سطر مستقل، وافصل بين الأجزاء بعلامة |"></textarea>
    <p class="hint" id="formatHint">صيغة السؤال: السؤال | الإجابة الصحيحة | خيار خاطئ 1 | خيار خاطئ 2</p>
    <label for="names">أسماء الطلاب أو الفرق (اختياري)</label>
    <textarea id="names" style="min-height:70px" placeholder="اكتب اسم كل طالب أو فريق في سطر مستقل"></textarea>
    <div class="row">
      <div>
        <label for="roundCount">عدد الأسئلة في الجولة</label>
        <select id="roundCount">
          <option value="5">5 أسئلة</option>
          <option value="10" selected>10 أسئلة</option>
          <option value="15">15 سؤالًا</option>
          <option value="30">30 سؤالًا</option>
          <option value="100">كل الأسئلة</option>
        </select>
      </div>
      <div>
        <label for="seconds">وقت السؤال</label>
        <select id="seconds">
          <option value="0">بدون مؤقت</option>
          <option value="10">10 ثوانٍ</option>
          <option value="20">20 ثانية</option>
          <option value="30">30 ثانية</option>
        </select>
      </div>
    </div>
    <div class="actions">
      <button class="primary" onclick="startGame()">▶ ابدأ اللعبة</button>
      <button class="secondary" onclick="saveGame()">💾 احفظ اللعبة</button>
      <button class="secondary" onclick="sampleData()">✨ جرّب مثالًا</button>
      <button class="secondary" onclick="makeAIPrompt()">🤖 مساعد إعداد الأسئلة</button>
    </div>
    <div id="savedGames" class="actions"></div>
  </section>

  <section id="playArea">
    <div class="play-box">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <b id="playTitle" class="gold">اللعبة</b>
        <span id="questionCount">السؤال 1</span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <div id="teamBoard" class="scoreboard"></div>
      <div id="gameContent"></div>
      <div id="question"></div>
      <div id="answers" class="answers"></div>
      <div id="feedback" aria-live="polite"></div>
      <div class="actions" style="justify-content:center">
        <button id="nextBtn" class="primary hidden" onclick="nextQuestion()">السؤال التالي ←</button>
        <button class="secondary" onclick="toggleFullscreen()">⛶ ملء الشاشة</button>
        <button class="secondary" onclick="stopGame()">العودة للإعدادات</button>
      </div>
    </div>
  </section>
</main>
<footer>سراج للتعليم • التعلّم باللعب يصنع الفرق ✨</footer>

<script>
const types=[
{id:'quiz',icon:'🧠',name:'اختيار من متعدد',desc:'أسئلة بأربع إجابات محتملة'},
{id:'truefalse',icon:'✅',name:'صح أم خطأ',desc:'اختبر فهم الطلاب بسرعة'},
{id:'millionaire',icon:'💰',name:'تحدي المليون',desc:'تدرّج في مستويات الأسئلة'},
{id:'wheel',icon:'🎡',name:'عجلة الأسماء',desc:'اختر طالبًا بطريقة عشوائية'},
{id:'mystery',icon:'🎁',name:'صندوق المفاجآت',desc:'افتح صندوقًا واكتشف السؤال'},
{id:'cards',icon:'🃏',name:'البطاقات العشوائية',desc:'اختر بطاقة من مجموعة البطاقات'},
{id:'flash',icon:'🗂️',name:'بطاقات التذكّر',desc:'اعرض السؤال ثم اكشف الإجابة'},
{id:'match',icon:'🔗',name:'لعبة المطابقة',desc:'طابق السؤال مع الإجابة الصحيحة'},
{id:'teams',icon:'🏆',name:'تحدي الفرق',desc:'تنافس الفرق واجمع النقاط'},
{id:'speed',icon:'⚡',name:'تحدي السرعة',desc:'أجب عن أكبر عدد من الأسئلة'},
{id:'random',icon:'🎲',name:'السؤال العشوائي',desc:'اسحب سؤالًا عشوائيًا'},
{id:'order',icon:'🔢',name:'رتّب الإجابات',desc:'اكتب عناصر الترتيب الصحيح'},
{id:'odd',icon:'🔎',name:'اكتشف المختلف',desc:'حدد الكلمة أو العنصر المختلف'},
{id:'exit',icon:'🚪',name:'بطاقة الخروج',desc:'سؤال ختامي لتقييم فهم الدرس'},
{id:'open',icon:'💬',name:'سؤال مفتوح',desc:'أسئلة للنقاش والإجابة الشفهية'}
];
let selected='quiz',questions=[],current=0,points=0,answered=false,used=[],teamScores=[0,0],activeTeam=0,timer=null,remaining=0;
const $=id=>document.getElementById(id);
function renderTypes(){
 $('gameGrid').innerHTML=types.map(t=>`<button class="game-card ${selected===t.id?'selected':''}" onclick="chooseType('${t.id}')"><span class="game-icon">${t.icon}</span><b>${t.name}</b><small>${t.desc}</small></button>`).join('');
}
function chooseType(id){
 selected=id;renderTypes();
 const hints={
 wheel:'اكتب أسماء الطلاب في خانة الأسماء، كل اسم في سطر.',
 truefalse:'الصيغة: العبارة | صح أو خطأ. مثال: الشمس نجم | صح',
 cards:'صيغة كل بطاقة: السؤال | الإجابة.',
 flash:'صيغة كل بطاقة: السؤال | الإجابة.',
 match:'صيغة كل زوج: العنصر الأول | العنصر المطابق.',
 order:'اكتب سؤال الترتيب | العنصر الأول | العنصر الثاني | العنصر الثالث، بالترتيب الصحيح.',
 odd:'صيغة كل سؤال: السؤال | المختلف | عنصر آخر | عنصر آخر. اجعل الإجابة الصحيحة أول عنصر بعد السؤال.',
 open:'اكتب كل سؤال في سطر، أو السؤال | نموذج الإجابة.',
 exit:'اكتب أسئلة ختامية، ويمكن إضافة الإجابة بعد علامة |.',
 default:'صيغة السؤال: السؤال | الإجابة الصحيحة | خيار خاطئ 1 | خيار خاطئ 2'
 };
 $('formatHint').textContent=hints[id]||hints.default;
 $('entries').placeholder=id==='wheel'?'اكتب أسماء الطلاب في خانة الأسماء أدناه.':hints[id]||hints.default;
}
function parseLines(){
 return $('entries').value.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>line.split('|').map(x=>x.trim()));
}
function shuffle(arr){return arr.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);}
function sampleData(){
 $('lesson').value='مراجعة عامة';
 $('gameTitle').value='تحدي المعرفة';
 $('entries').value=[
 'ما عاصمة سلطنة عُمان؟ | مسقط | صلالة | نزوى | صحار',
 'كم عدد أيام الأسبوع؟ | 7 | 5 | 6 | 8',
 'ما ناتج 5 + 3؟ | 8 | 7 | 9 | 10',
 'أيّ الكواكب أقرب إلى الشمس؟ | عطارد | الأرض | المريخ | زحل',
 'ما جمع كلمة كتاب؟ | كتب | كاتبان | مكتبة | كاتب',
 'ما العضو الذي يضخ الدم؟ | القلب | الرئة | المعدة | الكبد',
 'كم ضلعًا للمثلث؟ | 3 | 4 | 5 | 6',
 'أيّ هذه الحيوانات من الثدييات؟ | الحصان | التمساح | السلحفاة | السمكة'
 ].join('\n');
 $('names').value='الفريق الأول\nالفريق الثاني\nالفريق الثالث';
 chooseType('quiz');
}
function makeAIPrompt(){
 const lesson=$('lesson').value.trim()||'موضوع يحدده المعلم';
 const prompt=`أنشئ 15 سؤالًا تعليميًا مناسبًا للطلاب عن: ${lesson}. أخرج النتائج بالعربية فقط، كل سؤال في سطر واحد بالصيغة التالية: السؤال | الإجابة الصحيحة | خيار خاطئ 1 | خيار خاطئ 2 | خيار خاطئ 3. اجعل الخيارات واضحة، وتأكد من صحة الإجابات، ولا تستخدم علامة | داخل السؤال أو الإجابات. أرسل الأسئلة فقط دون مقدمة.`;
 const w=window.open('','_blank');
 if(w){w.document.write('<title>مساعد إعداد الأسئلة</title><body style="font:18px Tahoma;direction:rtl;padding:24px;background:#10162f;color:white"><h2>انسخ الطلب إلى أداة ذكاء اصطناعي</h2><p>هذا الموقع لا يتصل بخدمة ذكاء اصطناعي مباشرة. انسخ النص وأرسله إلى الأداة التي تستخدمها، ثم ألصق الأسئلة الناتجة في الموقع.</p><textarea style="width:100%;height:220px;font:16px Tahoma">'+prompt.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</textarea><button onclick="navigator.clipboard.writeText(document.querySelector(\\'textarea\\').value)">نسخ الطلب</button></body>');}
 else alert(prompt);
}
function saveGame(){
 const item={id:Date.now(),type:selected,lesson:$('lesson').value,title:$('gameTitle').value,entries:$('entries').value,names:$('names').value};
 const all=JSON.parse(localStorage.getItem('sirajGames')||'[]');
 all.unshift(item);localStorage.setItem('sirajGames',JSON.stringify(all.slice(0,50)));
 updateStats();renderSaved();alert('تم حفظ اللعبة على هذا الجهاز.');
}
function updateStats(){
 const all=JSON.parse(localStorage.getItem('sirajGames')||'[]');
 $('totalGames').textContent=all.length;
 $('totalPoints').textContent=localStorage.getItem('sirajPoints')||0;
}
function renderSaved(){
 const all=JSON.parse(localStorage.getItem('sirajGames')||'[]');
 $('savedGames').innerHTML=all.length?'<b style="width:100%">📚 ألعابك المحفوظة</b>'+all.map(g=>`<button class="secondary" onclick="loadGame(${g.id})">${esc(g.title||g.lesson||'لعبة محفوظة')}</button><button class="danger" onclick="deleteGame(${g.id})">حذف</button>`).join(''):'';
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function loadGame(id){
 const g=JSON.parse(localStorage.getItem('sirajGames')||'[]').find(x=>x.id===id);if(!g)return;
 chooseType(g.type);$('lesson').value=g.lesson||'';$('gameTitle').value=g.title||'';$('entries').value=g.entries||'';$('names').value=g.names||'';
 window.scrollTo({top:0,behavior:'smooth'});
}
function deleteGame(id){
 localStorage.setItem('sirajGames',JSON.stringify(JSON.parse(localStorage.getItem('sirajGames')||'[]').filter(x=>x.id!==id)));
 updateStats();renderSaved();
}
function startGame(){
 if(selected==='wheel'&&!$('names').value.trim()){alert('اكتب أسماء الطلاب أولًا، كل اسم في سطر.');return;}
 questions=parseLines();
 if(selected!=='wheel'&&!questions.length){alert('أضف سؤالًا واحدًا على الأقل. يمكنك الضغط على جرّب مثالًا.');return;}
 questions=shuffle(questions);current=0;points=0;answered=false;used=[];teamScores=[0,0];activeTeam=0;
 const count=Number($('roundCount').value);
 if(selected!=='wheel')questions=questions.slice(0,count);
 $('builder').classList.add('hidden');$('playArea').style.display='block';
 $('playTitle').textContent=$('gameTitle').value||types.find(t=>t.id===selected).name;
 $('gameContent').innerHTML='';$('feedback').textContent='';
 if(selected==='wheel')renderWheel();else showQuestion();
 $('playArea').scrollIntoView({behavior:'smooth'});
}
function renderTeams(){
 if(selected!=='teams'){$('teamBoard').innerHTML='';return;}
 $('teamBoard').innerHTML=teamScores.map((s,i)=>`<div class="team">الفريق ${i+1}<br><strong>${s}</strong> نقطة<br><button class="secondary" onclick="activeTeam=${i};renderTeams()">اختيار الفريق</button>${activeTeam===i?' ◀':''}</div>`).join('');
}
function showQuestion(){
 clearInterval(timer);answered=false;
 if(current>=questions.length){finishGame();return;}
 const q=questions[current],type=selected;
 $('questionCount').textContent=`السؤال ${current+1} من ${questions.length}`;
 $('progressBar').style.width=(current/questions.length*100)+'%';
 $('question').textContent=q[0]||'';
 $('answers').innerHTML='';$('gameContent').innerHTML='';$('feedback').textContent='';$('nextBtn').classList.add('hidden');
 renderTeams();
 if(type==='wheel'){renderWheel();return;}
 if(type==='cards'||type==='flash'||type==='random'||type==='mystery'||type==='exit'||type==='open'){
  $('answers').innerHTML=`<button class="answer" onclick="revealAnswer()">👀 اكشف الإجابة / نموذج الإجابة</button>`;
  return;
 }
 if(type==='order'){
  const items=q.slice(1);$('answers').innerHTML=`<input id="orderInput" placeholder="اكتب العناصر بالترتيب، وافصل بينها بفواصل"><button class="answer" onclick="checkOrder()">تحقق من الترتيب</button>`;return;
 }
 if(type==='match'){
  const pairs=questions.map(x=>({a:x[0],b:x[1]}));const target=pairs[current];
  $('question').textContent='اختر الإجابة المطابقة: '+target.a;
  $('answers').innerHTML=shuffle(pairs.map(x=>x.b)).map(a=>`<button class="answer" onclick="checkMatch(this,'${encodeURIComponent(target.b)}','${encodeURIComponent(a)}')">${esc(a)}</button>`).join('');return;
 }
 if(type==='odd'){
  const opts=q.slice(1);$('answers').innerHTML=shuffle(opts).map(a=>`<button class="answer" onclick="chooseAnswer(this,'${encodeURIComponent(q[1])}','${encodeURIComponent(a)}')">${esc(a)}</button>`).join('');return;
 }
 if(type==='truefalse'){
  $('answers').innerHTML=['صح','خطأ'].map(a=>`<button class="answer" onclick="chooseAnswer(this,'${encodeURIComponent(q[1]||'صح')}','${encodeURIComponent(a)}')">${a}</button>`).join('');return;
 }
 if(type==='teams'||type==='quiz'||type==='millionaire'||type==='speed'){
  let opts=q.slice(1);
  if(opts.length<2)opts=[q[1]||'الإجابة', 'حاول مرة أخرى'];
  opts=shuffle(opts);
  $('answers').innerHTML=opts.map(a=>`<button class="answer" onclick="chooseAnswer(this,'${encodeURIComponent(q[1]||'')}','${encodeURIComponent(a)}')">${esc(a)}</button>`).join('');
  if(type==='millionaire')$('gameContent').innerHTML=`<div class="gold">🏅 المستوى ${current+1} من ${questions.length}</div>`;
  if(type==='speed')$('gameContent').innerHTML='<div class="gold">⚡ اجمع أكبر عدد من النقاط!</div>';
  const secs=Number($('seconds').value);
  if(secs>0){remaining=secs;$('gameContent').innerHTML+=`<div id="timerLabel">⏱️ ${remaining} ثانية</div>`;timer=setInterval(()=>{remaining--;$('timerLabel')&&($('timerLabel').textContent='⏱️ '+remaining+' ثانية');if(remaining<=0){clearInterval(timer);if(!answered){answered=true;$('feedback').textContent='انتهى الوقت!';$('nextBtn').classList.remove('hidden');}}},1000);}
 }
}
function chooseAnswer(btn,correct,chosen){
 if(answered)return;answered=true;clearInterval(timer);
 const ok=decodeURIComponent(correct)===decodeURIComponent(chosen);
 btn.classList.add(ok?'correct':'wrong');
 if(ok){points+=selected==='millionaire'?(current+1)*100:10;if(selected==='teams')teamScores[activeTeam]+=10;$('feedback').textContent='🎉 إجابة صحيحة! أحسنت.';}
 else $('feedback').textContent='الإجابة الصحيحة: '+decodeURIComponent(correct);
 [...$('answers').querySelectorAll('button')].forEach(b=>b.disabled=true);
 renderTeams();$('nextBtn').classList.remove('hidden');
}
function checkMatch(btn,correct,chosen){
 if(answered)return;answered=true;
 const ok=decodeURIComponent(correct)===decodeURIComponent(chosen);
 btn.classList.add(ok?'correct':'wrong');points+=ok?10:0;
 $('feedback').textContent=ok?'رائع! تطابق صحيح.':'الإجابة المطابقة: '+decodeURIComponent(correct);
 $('nextBtn').classList.remove('hidden');
}
function checkOrder(){
 if(answered)return;answered=true;
 const expected=questions[current].slice(1).join(',').replace(/\s/g,'').toLowerCase();
 const got=$('orderInput').value.replace(/\s/g,'').toLowerCase();
 if(got===expected){points+=10;$('feedback').textContent='ترتيب صحيح! 🎉';}
 else $('feedback').textContent='الترتيب الصحيح: '+questions[current].slice(1).join(' ← ');
 $('nextBtn').classList.remove('hidden');
}
function revealAnswer(){
 if(answered)return;answered=true;
 const q=questions[current];$('feedback').textContent='الإجابة / النموذج: '+(q.slice(1).join('، ')||'ناقش الإجابة مع الطلاب.');
 points+=5;$('nextBtn').classList.remove('hidden');
}
function renderWheel(){
 const names=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);
 $('question').textContent='من سيشارك في الإجابة؟';
 $('answers').innerHTML='';
 $('gameContent').innerHTML=`<div class="big-wheel"><span id="wheelName">سراج 🎡</span></div><button class="primary" onclick="spinWheel()">🎡 أدر العجلة</button>`;
 window.wheelNames=names;
}
function spinWheel(){
 if(!window.wheelNames||!window.wheelNames.length)return;
 const el=$('wheelName');el.textContent='...';
 setTimeout(()=>{const n=window.wheelNames[Math.floor(Math.random()*window.wheelNames.length)];el.textContent=n;$('feedback').textContent='الدور الآن على: '+n;},900);
}
function nextQuestion(){current++;showQuestion();}
function finishGame(){
 clearInterval(timer);$('progressBar').style.width='100%';$('question').textContent='🏆 انتهت اللعبة!';
 $('answers').innerHTML='';$('gameContent').innerHTML=`<h2 class="gold">نتيجتك: ${points} نقطة</h2><p>أحسنت! يمكنك إعادة اللعب أو العودة إلى إعدادات الألعاب.</p>`;
 $('feedback').textContent='شكرًا لمشاركتكم في لعبة سراج.';
 let total=Number(localStorage.getItem('sirajPoints')||0)+points;
 localStorage.setItem('sirajPoints',total);updateStats();
 $('nextBtn').classList.add('hidden');
}
function stopGame(){
 clearInterval(timer);$('playArea').style.display='none';$('builder').classList.remove('hidden');
 $('builder').scrollIntoView({behavior:'smooth'});
}
function toggleFullscreen(){
 const el=$('playArea');
 if(!document.fullscreenElement){if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}
 else if(document.exitFullscreen)document.exitFullscreen();
}
renderTypes();updateStats();renderSaved();chooseType('quiz');
</script>
</body>
</html>
